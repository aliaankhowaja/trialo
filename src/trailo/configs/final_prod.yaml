run_name: final_prod
seed: 42

model:
  model_id: google/gemma-3-270m-it
  revision: ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
  allow_cpu_oversize: false
  attn_implementation: sdpa

data:
  manifest_path: data/splits/split_manifest.json
  processed_dir: data/processed/final_prod
  max_length: 1024
  include_test: false
  allow_truncated_eval: false
  prepare_subset_size: null

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  device: cuda
  precision: bf16
  batch_size: 8
  gradient_accumulation: 1 # effective batch 8 of 603 examples (no accumulation needed for 270m)
  epochs: 4
  max_steps: -1
  subset_size: null
  learning_rate: 0.0002 # higher LR restored for the small model (2e-4 halving was for E4B)
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 5
  eval_every_steps: 25
  early_stopping_patience: 6
  gradient_checkpointing: false # not needed for 270m, faster without it

eval:
  max_new_tokens: 128
  do_sample: false
  num_beams: 1
  decoding_impl: generate
  batch_size: 1
  subset_size: null

wandb:
  enabled: true
  project: trialo
  entity: murgi
  mode: online
  log_gradients: false
