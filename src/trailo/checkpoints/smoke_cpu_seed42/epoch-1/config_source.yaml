run_name: smoke_cpu
seed: 42

model:
  model_id: google/gemma-3-270m-it
  revision: ac82b4e820549b854eebf28ce6dedaf9fdfa17b3
  allow_cpu_oversize: false
  attn_implementation: sdpa

data:
  manifest_path: data/splits/split_manifest.json
  processed_dir: data/processed/smoke_cpu
  max_length: 1024
  include_test: false
  allow_truncated_eval: false
  prepare_subset_size: 8

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  device: cpu
  precision: fp32
  batch_size: 1
  gradient_accumulation: 2
  epochs: 1
  max_steps: 3
  subset_size: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 1
  eval_every_steps: 3
  early_stopping_patience: 2
  gradient_checkpointing: false

eval:
  max_new_tokens: 128
  do_sample: false
  num_beams: 1
  batch_size: 1
  subset_size: 8

wandb:
  enabled: true
  project: trialo-smoke
  entity: null
  mode: offline
  log_gradients: false
