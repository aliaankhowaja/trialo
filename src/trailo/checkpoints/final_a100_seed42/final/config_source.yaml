run_name: final_a100
seed: 42

model:
  model_id: google/gemma-3n-E4B-it
  revision: c1221e9c62e34a43ab7ffacd1be0ea71f126ef10
  allow_cpu_oversize: false
  attn_implementation: sdpa

data:
  manifest_path: data/splits/split_manifest.json
  processed_dir: data/processed/final_a100
  max_length: 1024
  include_test: false
  allow_truncated_eval: false
  prepare_subset_size: null

lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  device: cuda
  precision: bf16
  batch_size: 2
  gradient_accumulation: 4 # effective batch 8 of 603 examples
  epochs: 4
  max_steps: -1
  subset_size: null
  learning_rate: 0.0001 # halved from 2e-4: was memorizing by epoch 3
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 5
  eval_every_steps: 25
  early_stopping_patience: 6
  # OOM'd on batches padded to ~520 tokens (fp32 logits = 2x520x262144x4B "~1.09GB").
  # Checkpointing trades ~25-30% speed for ~10+ GiB activation headroom.
  gradient_checkpointing: true

eval:
  max_new_tokens: 128
  do_sample: false
  num_beams: 1
  batch_size: 1
  subset_size: null

wandb:
  enabled: true
  project: trialo
  entity: murgi
  mode: online
  log_gradients: false
