server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React app; fall back to index.html for any unknown path.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend service defined in docker-compose.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Fail fast when the backend is not up yet (default connect timeout is
        # 60s, which reads as an endless 'loading' page).
        proxy_connect_timeout 5s;
        # SSE support: no buffering, long read window (screening runs slowly on CPU).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
